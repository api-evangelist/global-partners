aid: global-partners
name: Global Partners LP
description: 'Global Partners LP is a leading independent owner, supplier, and operator of liquid energy terminals, fueling
  locations, and retail experiences. The company distributes gasoline, distillates, residual oil, renewable fuels, crude oil,
  and propane across the Northeast United States through an integrated network of terminals, gas stations, and convenience
  stores. Global Partners publishes no developer program, no API keys and no API documentation, but www.globalp.com runs on
  WordPress and serves a fully public, unauthenticated WordPress REST API whose custom content types model the company itself:
  157 terminals (sw_terminal), 846 retail locations (sw_retail_location), real-estate listings, leadership profiles, and the
  product, service, fuel-type, fuel-brand, retail-brand, state, supply-method and ownership-status taxonomies applied to them.'
