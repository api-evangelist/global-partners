source: live HTTPS probes of the /.well-known/ surface on every host the record knows
note: >-
  Probed six Global Partners hosts. The corporate site (www.globalp.com / globalp.com) publishes no
  /.well-known/ discovery documents at all — every path 404s, and the 404 body is the WordPress theme's
  HTML error page. connect.globalp.com (the GlobalCONNECT customer portal, ASP.NET) and ir.globalp.com
  (the Q4 Inc investor-relations platform) both answer 200 to EVERY /.well-known/ path with a catch-all
  body — the portal login HTML and the string "Invalid key" respectively — so those are soft-200 shells,
  not documents, and are recorded as misses. ONE real document was found: digitalassets.globalp.com, the
  Global Partners Brand Portal, serves a valid RFC 8414 OAuth 2.0 Authorization Server Metadata document
  whose issuer is itself. That host is a Bynder DAM tenant running under a Global Partners subdomain, so
  the document is served by a Global Partners host but the authorization server is the vendor's platform,
  not a Global Partners product. The non-well-known discovery surface that does exist on the corporate
  site — robots.txt, the Yoast sitemap index, and the WordPress REST API root — is recorded below.
